services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nocap
      POSTGRES_PASSWORD: nocap
      POSTGRES_DB: shop
    ports:
      - "5433:5432"   # 5433 on the host: 5432 is often taken by a local Postgres
    volumes:
      - ./demo/seed:/docker-entrypoint-initdb.d:ro
